  <style>
    @keyframes map-light-pulse{0%{opacity:1;transform:scale(.42)}100%{opacity:0;transform:scale(2.4)}}
    .map-pulse{transform-box:fill-box;transform-origin:center;animation:map-light-pulse 2.1s ease-out infinite}
    .map-pulse--two{animation-delay:.9s}.map-pulse--three{animation-delay:1.8s}
    .map-core,.map-star{filter:url(#gold-glow)}
    @media(prefers-reduced-motion:reduce){.map-pulse{animation:none;opacity:.32;transform:scale(1.35)}}
  </style>
