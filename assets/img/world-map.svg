<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <filter id="gold-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="8" result="softBlur"/>
      <feMerge><feMergeNode in="softBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
