name = "aym-chat"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://www.aym-inc.org,https://aym-inc.org,https://jobcreators4youth.github.io,http://localhost:8000,http://127.0.0.1:8000"
